name: Refresh profile calendar
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar.yml'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/calendar.yml'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: profile-calendar
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test renderer and validation
        run: node --test tests/*.test.mjs
  refresh:
    if: github.repository == 'mor4ee/mor4ee' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Node runtime
        run: node --version
      - name: Test renderer and validation
        run: node --test tests/*.test.mjs
      - name: Fetch approved aggregates and refresh SVG
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/refresh-published-profile.mjs
      - name: Commit changed calendar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/profile.svg assets/profile.mobile.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile contribution calendar'
          git push
